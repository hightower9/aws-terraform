name: Terraform CI

# MANUAL ONLY: this workflow never runs on its own (no push / pull_request
# triggers). Start it from GitHub → Actions → "Terraform CI" → Run workflow.
# To make it automatic again, add e.g.:
#   pull_request:
#     branches: [main]
on:
  workflow_dispatch:
    inputs:
      plan_environment:
        description: "Also run a real-AWS plan for this environment (needs AWS_ROLE_ARN secret)"
        type: choice
        default: none
        options: [none, dev, uat, prod]

env:
  TF_VERSION: "1.14.5"
  TF_IN_AUTOMATION: "true"

permissions:
  contents: read

defaults:
  run:
    # Explicit bash = `bash -eo pipefail`, so `plan | tee` can't hide errors.
    shell: bash

jobs:
  # -----------------------------------------------------------
  # Format + validate the single root config (offline)
  # -----------------------------------------------------------
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init (no backend)
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Preflight (placeholder report for every environment)
        run: |
          for e in dev uat; do bash scripts/preflight.sh "$e"; done
          # prod fails while placeholders remain; report but don't fail here
          bash scripts/preflight.sh prod || echo "::warning::prod still has placeholders (see docs/PRODUCTION.md)"

  # -----------------------------------------------------------
  # Security scan — fails the run on any finding not accepted
  # (with a reason) in .checkov.yml
  # -----------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          config_file: .checkov.yml
          quiet: true

  # -----------------------------------------------------------
  # Optional real-AWS plan via GitHub OIDC (no long-lived keys).
  # Setup: docs/PRODUCTION.md → "CI access".
  # -----------------------------------------------------------
  plan:
    name: Plan (${{ inputs.plan_environment }})
    if: inputs.plan_environment != 'none'
    runs-on: ubuntu-latest
    needs: [validate, security]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Preflight
        run: bash scripts/preflight.sh "${{ inputs.plan_environment }}"

      - name: Terraform Init
        run: terraform init -input=false -backend-config="environments/${{ inputs.plan_environment }}/backend.tfbackend"

      - name: Terraform Plan
        run: |
          terraform plan -input=false -no-color \
            -var-file="environments/${{ inputs.plan_environment }}/terraform.tfvars" \
            -out=tfplan 2>&1 | tee plan.txt

      - name: Plan summary
        if: always()
        run: |
          {
            echo "### Terraform plan — \`${{ inputs.plan_environment }}\`"
            echo '```hcl'
            head -c 60000 plan.txt 2>/dev/null || echo "(no plan output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
